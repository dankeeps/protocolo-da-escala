<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Protocolo da Escala</title>
<meta name="description" content="O método que fez uma oferta faturar 1 milhão de reais com ROAS acima de 2.30.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --destaque: #2559e0;
    --texto-no-destaque: #fff;
    --botao: #1fa85a;          /* verde do botão (versão azul: #2559e0 / #5a88fb / #1d4ccc) */
    --botao-hover: #27b965;
    --botao-claro: #4fd88a;    /* reflexo */
    --botao-fundo: #178a48;
    --botao-hover-claro: #66e39b;
    --destaque-forte: #3a6cf0;
    --texto: #f5f5f5;
    --texto-2: rgba(245, 245, 245, .72);
    --vidro: rgba(255, 255, 255, .045);
    --vidro-borda: rgba(255, 255, 255, .11);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--texto); overflow-x: clip; }
  body {
    font-family: "Inter Tight", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* halos azuis: círculos sólidos desfocados */
  .halo { position: fixed; border-radius: 50%; pointer-events: none; z-index: 0; filter: blur(130px); }
  .halo-1 { width: 480px; height: 480px; background: var(--destaque); opacity: .12; top: -80px; left: -220px; }
  .halo-2 { width: 460px; height: 460px; background: var(--destaque); opacity: .08; bottom: -220px; right: -160px; }
  .halo-3 { width: 420px; height: 420px; background: var(--destaque); opacity: .06; top: -200px; right: -180px; }
  .halo-4 { width: 420px; height: 420px; background: var(--destaque); opacity: .06; bottom: -200px; left: -180px; }
  /* fundo de "código hacker": texto bem apagado, preenchido por JS. Nítido fora da caixa, levemente desfocado através do vidro */
  .textura {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    padding: 6px 10px;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; line-height: 17px; white-space: pre;
    color: rgba(255, 255, 255, .085);
  }
  .textura .az { color: rgba(80, 125, 255, .3); }

  .vidro {
    background: var(--vidro);
    border: 1px solid var(--vidro-borda);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    backdrop-filter: blur(18px) saturate(140%);
  }

  /* ───────── seção 1: faixa do lançamento ───────── */
  .topo {
    position: relative; z-index: 5; background: transparent;
    padding: 18px 16px; text-align: center;
  }
  .topo p { text-shadow: 0 0 10px #000, 0 0 18px #000; font-size: 15px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; }
  .topo .sep-ponto { color: var(--destaque); margin: 0 .7em; }

  /* ───────── seção 2: hero ───────── */
  .hero {
    position: relative; z-index: 2;
    max-width: 1180px; margin: 0 auto;
    padding: 36px 16px;
    min-height: calc(100vh - 58px);
    display: flex; align-items: center;
  }
  /* manchas de luz atrás da caixa: é o que o vidro desfoca */
  .hero::before, .hero::after {
    content: ""; position: absolute; border-radius: 50%; pointer-events: none; z-index: -1;
    background: var(--destaque); filter: blur(55px);
  }
  /* brilho azul centrado em dois cantos opostos da caixa (em cima à esquerda, embaixo à direita):
     metade fica fora e metade passa pelo vidro, e isso desenha a beirada da caixa */
  .hero::before { width: 280px; height: 280px; left: calc(16px - 140px); top: calc(36px - 140px); opacity: .32; }
  .hero::after { width: 280px; height: 280px; right: calc(16px - 140px); bottom: calc(36px - 140px); opacity: .28; }
  @media (max-width: 860px) {
    .hero::before { width: 200px; height: 200px; left: calc(12px - 100px); top: calc(14px - 100px); filter: blur(45px); }
    .hero::after { width: 200px; height: 200px; right: calc(12px - 100px); bottom: calc(16px - 100px); filter: blur(45px); }
  }
  /* caixa de vidro que envolve texto + expert */
  .painel {
    position: relative; width: 100%; overflow: hidden;
    display: grid; grid-template-columns: 1.12fr .88fr; align-items: end; gap: 8px;
    padding: 0 0 0 64px; min-height: calc(100vh - 58px - 72px);
    border-radius: 32px;
    background: transparent;   /* sem véu: onde o fundo é preto, fica preto absoluto */
    border: 0;
    -webkit-backdrop-filter: blur(3px) saturate(130%);
    backdrop-filter: blur(3px) saturate(130%);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .35);
  }
  /* formato de ticket: borda de cima e de baixo picotadas (meias-luas pequenas em sequência) */
  .painel {
    --dente: 7px; --passo: 24px;
    -webkit-mask:
      radial-gradient(circle var(--dente) at 50% 0, #0000 98%, #000) top / var(--passo) 51% repeat-x,
      radial-gradient(circle var(--dente) at 50% 100%, #0000 98%, #000) bottom / var(--passo) 51% repeat-x;
    mask:
      radial-gradient(circle var(--dente) at 50% 0, #0000 98%, #000) top / var(--passo) 51% repeat-x,
      radial-gradient(circle var(--dente) at 50% 100%, #0000 98%, #000) bottom / var(--passo) 51% repeat-x;
  }
  /* faixas em cima e embaixo: um pouco mais claras e mais desfocadas, para marcar o picote */
  .painel::before, .painel::after {
    content: ""; position: absolute; left: 0; right: 0; height: 64px; z-index: 0; pointer-events: none;
    -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
  }
  .painel::before { top: 0; background: linear-gradient(to bottom, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0)); }
  .painel::after { bottom: 0; background: linear-gradient(to top, rgba(255, 255, 255, .05), rgba(255, 255, 255, 0)); }
  .painel > .conteudo, .painel > .foto { position: relative; z-index: 1; }
  .conteudo { padding: 64px 0; align-self: center; min-width: 0; }
  /* cada linha é ajustada por JS para ocupar a largura da coluna */
  h1 { font-weight: 600; line-height: 1.12; width: 100%; overflow: hidden; text-transform: uppercase; letter-spacing: -.01em; }
  h1 .l1, h1 .l2, h1 .l3 { display: block; white-space: nowrap; width: max-content; font-size: 32px; }
    h1 .destaque { color: var(--destaque); }

  .data { margin-bottom: 16px; font-size: 16px; letter-spacing: .08em; color: var(--texto-2); }
  .data b { font-weight: 700; color: var(--texto); }

  .botao {
    display: inline-flex; align-items: center; justify-content: center; gap: 16px;
    margin-top: 26px; padding: 6px 6px 6px 26px; border-radius: 999px;
    /* reflexo em diagonal: azul mais claro no canto de cima à esquerda, indo para o azul do botão */
    background: linear-gradient(120deg, var(--botao-claro) 0%, var(--botao) 55%, var(--botao-fundo) 100%);
    color: #fff; text-decoration: none;
    font-weight: 600; font-size: 14px; letter-spacing: .08em; text-transform: uppercase;
    border: 0;
    transition: transform .2s, background .2s;
  }
  .botao:hover { transform: translateY(-1px); background: linear-gradient(120deg, var(--botao-hover-claro) 0%, var(--botao-hover) 55%, var(--botao) 100%); }
  .botao-seta {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    display: grid; place-items: center;
    background: #fff; color: var(--botao);
    transition: transform .25s;
  }
  .botao:hover .botao-seta { transform: translateX(3px); }
  .botao-wrap { display: block; }

  .foto { position: relative; align-self: end; height: 100%; padding-top: 48px; display: flex; align-items: flex-end; justify-content: center; }
  .foto img {
    position: relative; width: 128%; max-width: 720px; margin-left: -14%; height: auto; display: block;
    -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
    mask-image: linear-gradient(to bottom, #000 78%, transparent 100%);
  }
  .chip {
    position: absolute; z-index: 3; border-radius: 12px; padding: 11px 14px;
    display: flex; align-items: center; gap: 11px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .35);
  }
  .chip-icone { width: 32px; height: 32px; border-radius: 8px; background: #fff; display: grid; place-items: center; flex: none; }
  .chip-txt { display: flex; flex-direction: column; line-height: 1.2; }
  .chip-txt b { font-size: 14px; font-weight: 700; }
  .chip-txt span { font-size: 11px; color: var(--texto-2); }
  .chip-1 { right: 28px; top: 34%; animation: flutua 6s ease-in-out infinite; }
  .chip-2 { left: -10px; bottom: 22%; animation: flutua 6s ease-in-out infinite 3s; }
  /* glitch "HACKEADO": o conteúdo do cartão pisca e some, aparece HACKEADO por ~0,8s e volta.
     Ciclo de 6s por cartão, alternados (1,5s e 4,5s): na página acontece um a cada 3s. */
  .hackeado {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    font-size: 13px; font-weight: 700; letter-spacing: .28em; color: #fff;
    opacity: 0; pointer-events: none;
  }
  .chip-1 .chip-icone, .chip-1 .chip-txt { animation: some 6s steps(1) infinite 1.5s; }
  .chip-2 .chip-icone, .chip-2 .chip-txt { animation: some 6s steps(1) infinite 4.5s; }
  .chip-1 .hackeado { animation: hackeado 6s steps(1) infinite 1.5s; }
  .chip-2 .hackeado { animation: hackeado 6s steps(1) infinite 4.5s; }
  @keyframes some {
    0%, 78% { opacity: 1; }
    78.5% { opacity: .1; }
    79.3% { opacity: 1; }
    80%, 94% { opacity: 0; }
    94.6% { opacity: .5; }
    95.2% { opacity: 0; }
    95.8%, 100% { opacity: 1; }
  }
  @keyframes hackeado {
    0%, 79.9% { opacity: 0; }
    80% { opacity: 1; }
    81% { opacity: .35; }
    81.6%, 93.9% { opacity: 1; }
    94%, 94.6% { opacity: 0; }
    95.2% { opacity: .6; }
    95.8%, 100% { opacity: 0; }
  }

  @keyframes flutua { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

  /* entrada */
  .entra { opacity: 0; transform: translateY(14px); animation: entra .8s cubic-bezier(.2, .7, .2, 1) forwards; }
  .d1 { animation-delay: .05s; } .d2 { animation-delay: .15s; } .d3 { animation-delay: .25s; } .d4 { animation-delay: .35s; }
  @keyframes entra { to { opacity: 1; transform: none; } }

  /* ───────── celular ───────── */
  @media (max-width: 860px) {
    .topo { padding: 14px 12px; }
    .topo p { font-size: 12px; letter-spacing: .18em; }
    .halo-1 { width: 360px; height: 360px; top: -200px; left: -160px; filter: blur(100px); }

    .foto img { width: 118%; margin-left: -9%; }
    .hero { padding: 14px 12px 16px; min-height: 0; }
    .painel { --dente: 6px; --passo: 20px; }
    .painel { grid-template-columns: 1fr; align-content: start; gap: 0; padding: 0 18px 48px; min-height: calc(100svh - 74px); border-radius: 24px; }
    .foto { order: -1; height: auto; margin: 0 -18px; padding-top: 18px; }
    .foto img { max-width: 520px; -webkit-mask-image: linear-gradient(to bottom, #000 62%, transparent 98%); mask-image: linear-gradient(to bottom, #000 62%, transparent 98%); }
    .chip { padding: 8px 10px; gap: 8px; border-radius: 10px; }
    .chip-icone { width: 26px; height: 26px; border-radius: 7px; }
    .chip-txt b { font-size: 12px; } .chip-txt span { font-size: 10px; }
    .hackeado { font-size: 11px; letter-spacing: .24em; }
    .chip-1 { right: 22px; top: 34%; }
    .chip-2 { left: 22px; bottom: 30%; }

    .conteudo { padding: 0; margin-top: -96px; position: relative; text-align: center; }
    h1 .l1, h1 .l2, h1 .l3 { margin-left: auto; margin-right: auto; }
    .data { margin-bottom: 12px; font-size: 14px; }
    .botao { margin-top: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .entra, .chip, .chip-icone, .chip-txt { animation: none; opacity: 1; transform: none; }
    .hackeado { display: none; }
  }
</style>
</head>
<body>
  <div class="textura" id="codigo" aria-hidden="true"></div>
  <div class="halo halo-1"></div>
  <div class="halo halo-2"></div>
  <div class="halo halo-3"></div>
  <div class="halo halo-4"></div>

  <!-- SEÇÃO 1 -->
  <header class="topo">
    <p>Lançamento<span class="sep-ponto">•</span>Protocolo da Escala</p>
  </header>

  <!-- SEÇÃO 2 -->
  <main class="hero">
   <div class="painel">
    <div class="conteudo">
      <p class="data entra d1">DIA <b id="data-dia">XX/XX</b> às <b>20h</b></p>
      <h1 class="entra d2" id="headline">
        <span class="l1">O método que fez uma oferta</span>
        <span class="l2">faturar <span class="destaque">1 Milhão de reais</span> com</span>
        <span class="l3">ROAS acima de 2.30</span>
      </h1>
      <div class="botao-wrap entra d4">
        <a class="botao" id="botao" href="#">
          QUERO PARTICIPAR
          <span class="botao-seta" aria-hidden="true">
            <svg width="14" height="14" viewBox="0 0 12 12" fill="none"><path d="M2 6h8M6.5 2.5 10 6l-3.5 3.5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </span>
        </a>
      </div>
    </div>

    <div class="foto entra d2">
      <img src="expert.webp" alt="Expert do Protocolo da Escala" width="1254" height="1254">
      <div class="chip chip-1 vidro">
        <div class="chip-icone"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg></div>
        <div class="chip-txt"><b>ROAS 2.30+</b><span>na escala</span></div>
        <span class="hackeado" aria-hidden="true">HACKEADO</span>
      </div>
      <div class="chip chip-2 vidro">
        <div class="chip-icone"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#000" stroke-width="2.4" stroke-linecap="round"><path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div>
        <div class="chip-txt"><b>R$ 1.000.000</b><span>faturados em uma oferta</span></div>
        <span class="hackeado" aria-hidden="true">HACKEADO</span>
      </div>
    </div>
   </div>
  </main>

<script>
  /* ═════ EDITE AQUI ═════ */
  var CONFIG = {
    evento: "2026-11-05T20:00:00-03:00",   // data e hora do lançamento (horário de Brasília) — mostra o DIA XX/XX
    link: "#"                                // para onde o botão leva (formulário, grupo, checkout)
  };
  /* ══════════════════════ */

  (function () {
    var d = new Date(CONFIG.evento);
    var p = function (n) { return String(n).padStart(2, "0"); };
    document.getElementById("data-dia").textContent = p(d.getDate()) + "/" + p(d.getMonth() + 1);
    document.getElementById("botao").href = CONFIG.link;


    // headline em 3 linhas, todas do mesmo tamanho: a mais comprida ocupa a largura da coluna
    var h1 = document.getElementById("headline");
    var linhas = [].slice.call(h1.querySelectorAll(".l1, .l2, .l3"));
    function ajusta() {
      var largura = h1.clientWidth;
      var max = window.innerWidth > 860 ? 46 : 30;
      linhas.forEach(function (l) { l.style.fontSize = "100px"; });
      var maior = Math.max.apply(null, linhas.map(function (l) { return l.scrollWidth; }));
      var tam = Math.min(max, 100 * largura / maior) + "px";
      linhas.forEach(function (l) { l.style.fontSize = tam; });
    }
    ajusta();
    if (document.fonts) document.fonts.ready.then(ajusta);
    window.addEventListener("resize", ajusta);

    // fundo de código: linhas aleatórias de "terminal" preenchendo a tela
    var codigo = document.getElementById("codigo");
    var trechos = [
      "sudo ./protocolo --escala --roas=2.30", "if (roas >= 2.30) { escalar(oferta); }",
      "const faturamento = 1_000_000;", "> ACCESS GRANTED", "ssh root@ads.manager -p 2230",
      "while (cpa < meta) budget *= 1.2;", "git push origin escala", "for (c of criativos) testar(c);",
      "[OK] pixel conectado", "export ROAS=2.30", "chmod +x escala.sh", "> decrypting campaign...",
      "return lucro;", "await meta.ads.scale({ roas: 2.3 })", "ping funil.local", "0xFF 0x2A 0x9C"
    ];
    var hex = "0123456789ABCDEF";
    function lixo(n) {
      var t = "";
      for (var i = 0; i < n; i++) t += Math.random() < .5 ? hex[Math.random() * 16 | 0] + hex[Math.random() * 16 | 0] + " " : (Math.random() < .5 ? "0" : "1");
      return t;
    }
    function escapa(t) { return t.replace(/&/g, "&amp;").replace(/</g, "&lt;"); }
    function preenche() {
      var linhas = Math.ceil(window.innerHeight / 17) + 2;
      var colunas = Math.ceil(window.innerWidth / 6.6) + 4;
      var html = [];
      for (var i = 0; i < linhas; i++) {
        var linha = "", tam = 0;
        while (tam < colunas) {
          var pedaco = Math.random() < .35 ? trechos[Math.random() * trechos.length | 0] : lixo(4 + (Math.random() * 10 | 0));
          pedaco += "   ";
          linha += Math.random() < .06 ? '<span class="az">' + escapa(pedaco) + "</span>" : escapa(pedaco);
          tam += pedaco.length;
        }
        html.push(linha);
      }
      codigo.innerHTML = html.join("\n");
    }
    preenche();

    var espera;
    window.addEventListener("resize", function () { clearTimeout(espera); espera = setTimeout(preenche, 200); });
  })();
</script>
</body>
</html>
